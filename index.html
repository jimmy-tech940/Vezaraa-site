<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vezaraa | Luxury Fashion & Streetwear</title>
    <meta name="description" content="Vezaraa - Ultra-premium luxury fashion and modern streetwear. Discover exclusive collections.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'luxury-green': '#1B4D3E',
                        'luxury-green-light': '#2D6B56',
                        'luxury-green-dark': '#0F2E25',
                        'midnight-navy': '#0A1628',
                        'midnight-navy-light': '#162844',
                        'midnight-navy-dark': '#060D1A',
                        'platinum': '#E8E6E1',
                        'platinum-dark': '#C4C0B8',
                        'black-gold': '#1A1408',
                        'gold': '#C9A84C',
                        'gold-light': '#D4BA6A',
                        'gold-dark': '#A68B3C',
                    },
                    fontFamily: {
                        'display': ['Playfair Display', 'serif'],
                        'body': ['Inter', 'sans-serif'],
                        'accent': ['Space Grotesk', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-out forwards',
                        'slide-up': 'slideUp 0.6s ease-out forwards',
                        'slide-down': 'slideDown 0.4s ease-out forwards',
                        'scale-in': 'scaleIn 0.4s ease-out forwards',
                        'float': 'float 6s ease-in-out infinite',
                        'shimmer': 'shimmer 2s linear infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideDown: {
                            '0%': { opacity: '0', transform: 'translateY(-20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        scaleIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' },
                        },
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.4); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(201,168,76,0.7); }

        /* Hide scrollbar for horizontal scroll */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-dark {
            background: rgba(10, 22, 40, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Text gradient */
        .text-gradient-gold {
            background: linear-gradient(135deg, #C9A84C 0%, #D4BA6A 50%, #A68B3C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Image hover zoom */
        .img-zoom-container { overflow: hidden; }
        .img-zoom-container img { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .img-zoom-container:hover img { transform: scale(1.08); }

        /* Magnetic button effect */
        .magnetic-btn { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Loader */
        .skeleton-loader {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* Smooth page transitions */
        .page-transition { transition: opacity 0.4s ease, transform 0.4s ease; }
        .page-hidden { opacity: 0; transform: translateY(20px); pointer-events: none; position: absolute; }
        .page-active { opacity: 1; transform: translateY(0); position: relative; }

        /* Hero video overlay */
        .hero-overlay {
            background: linear-gradient(to bottom, 
                rgba(10,22,40,0.3) 0%, 
                rgba(10,22,40,0.1) 40%, 
                rgba(10,22,40,0.6) 70%, 
                rgba(10,22,40,0.95) 100%);
        }

        /* Collection card hover */
        .collection-card { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .collection-card:hover { transform: translateY(-8px); }
        .collection-card .card-overlay { opacity: 0; transition: opacity 0.4s ease; }
        .collection-card:hover .card-overlay { opacity: 1; }

        /* Product card */
        .product-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        .product-card .quick-actions { opacity: 0; transform: translateY(10px); transition: all 0.3s ease; }
        .product-card:hover .quick-actions { opacity: 1; transform: translateY(0); }

        /* Cart drawer */
        .cart-drawer { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .cart-drawer.open { transform: translateX(0); }
        .cart-drawer.closed { transform: translateX(100%); }

        /* Modal */
        .modal-overlay { transition: opacity 0.3s ease; }
        .modal-content { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease; }

        /* Mega menu */
        .mega-menu { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .mega-menu.hidden-menu { opacity: 0; visibility: hidden; transform: translateY(-10px); }
        .mega-menu.visible-menu { opacity: 1; visibility: visible; transform: translateY(0); }

        /* Search overlay */
        .search-overlay { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .search-overlay.hidden-search { opacity: 0; visibility: hidden; }
        .search-overlay.visible-search { opacity: 1; visibility: visible; }

        /* Newsletter popup */
        .newsletter-popup { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .newsletter-popup.hidden-popup { opacity: 0; visibility: hidden; transform: scale(0.9); }
        .newsletter-popup.visible-popup { opacity: 1; visibility: visible; transform: scale(1); }

        /* Size selector */
        .size-option { transition: all 0.2s ease; }
        .size-option:hover:not(.disabled) { border-color: #C9A84C; color: #C9A84C; }
        .size-option.selected { background: #C9A84C; color: #0A1628; border-color: #C9A84C; }
        .size-option.disabled { opacity: 0.3; cursor: not-allowed; }

        /* Color variant */
        .color-variant { transition: all 0.2s ease; }
        .color-variant:hover { transform: scale(1.15); }
        .color-variant.selected { box-shadow: 0 0 0 2px #C9A84C, 0 0 0 4px rgba(201,168,76,0.3); }

        /* Tab indicator */
        .tab-indicator { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Progress bar */
        .progress-bar { transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Star rating */
        .star-rating { color: #C9A84C; }

        /* Toast notification */
        .toast { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .toast.hidden-toast { opacity: 0; transform: translateY(-20px) scale(0.95); }
        .toast.visible-toast { opacity: 1; transform: translateY(0) scale(1); }

        /* Dark mode specific */
        .dark body { background-color: #060D1A; color: #E8E6E1; }
        .dark .glass { background: rgba(10, 22, 40, 0.6); border-color: rgba(255, 255, 255, 0.05); }

        /* Custom checkbox */
        .custom-checkbox:checked + div { background: #C9A84C; border-color: #C9A84C; }
        .custom-checkbox:checked + div svg { display: block; }

        /* Range slider */
        input[type="range"] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #C9A84C; cursor: pointer; }

        /* Loading spinner */
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* 360 view simulation */
        .view-360 { cursor: grab; }
        .view-360:active { cursor: grabbing; }

        /* Parallax layers */
        .parallax-slow { will-change: transform; }
        .parallax-fast { will-change: transform; }
    </style>
</head>
<body class="font-body bg-platinum text-midnight-navy antialiased overflow-x-hidden">

    <!-- App Root -->
    <div id="app"></div>

    <script type="module" src="./app.js"></script>
</body>
</html>
<script src="app.js"></script>
</body>
</html>
